[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-fluid-dynamics"
version = "0.1.0"
description = "Minimal original-style autoresearch clone for fluid dynamics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imageio>=2.37.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "scipy>=1.15.0",
    "torch",
    "tqdm>=4.67.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
